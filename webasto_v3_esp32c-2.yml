#Автономность: Весь цикл от розжига до охлаждения прописан внутри script, что гарантирует его завершение даже при разрыве Wi-Fi соединения.
#LEDC PWM: Использование ledc на ESP32 обеспечивает тихую работу вентилятора (20 кГц) и эффективное управление свечой.
#Безопасность: Добавлен 5-секундный фильтр на срыв пламени, чтобы избежать ложных срабатываний из-за шумов ACS712, и жесткий триггер на 92°C.
#Помпа: Учтено управление циркуляционным насосом, который продолжает работать весь период охлаждения.
# Для реализации этого проекта на ESP32 требуется силовая развязка, так как компоненты Webasto (свеча, помпа, вентилятор) потребляют большие токи (до 15–20А в пике), а ESP32 работает на 3.3В с микротоками.
# 1. Основные силовые компоненты
# Свеча накала (Glow Plug): Нужен мощный N-канальный MOSFET с логическим управлением (Logic Level), способный выдержать 20А+.
# Рекомендую: IRLB3034 или AUIRLXB3034. Они полностью открываются от 3.3В. Обязательно на радиатор.
# Вентилятор (Fan): MOSFET на 5–10А.
# Рекомендую: IRLZ44N.
# Топливный насос и Помпа ОЖ: Можно использовать MOSFET попроще (например, AO3400 для SMD или IRLZ44N) или обычные автомобильные реле (через транзисторный ключ BC547).
# 2. Схема подключения (Распиновка ESP32)
# Компонент Webasto	Тип сигнала	GPIO ESP32	Схема подключения
# Свеча накала	PWM (LEDC)	GPIO 21	Через IRLB3034. Затвор (Gate) к GPIO через резистор 100 Ом.
# Вентилятор	PWM (LEDC)	GPIO 22	Через IRLZ44N. Обязательно диод (1N4007) параллельно мотору.
# Топливный насос	Импульс	GPIO 19	MOSFET или Реле.
# Помпа ОЖ	Вкл/Выкл	GPIO 18	Реле или MOSFET.
# NTC Датчик темп.	Аналог	GPIO 32	Делитель напряжения: 3.3V -> NTC -> GPIO32 -> Резистор 10k -> GND.
# Датчик тока (Flame)	Аналог	GPIO 35	Выход модуля ACS712 (20A). Питание модуля 5V, выход через делитель к ESP32.
# 3. Специфические узлы (Важно!)
# Датчик пламени (ACS712)
# Модуль ACS712 выдает 0–5В. ESP32 принимает максимум 3.3В.
# Решение: Между выходом ACS712 и GPIO35 поставьте делитель: резистор 2кОм (от ACS) и 3.3кОм (на GND).
# Логика: Мы меряем ток свечи. Когда солярка вспыхивает, свеча нагревается сильнее, её сопротивление растет, а ток падает. Это и есть сигнал "пламя есть".
# Датчик температуры (NTC)
# Штатный датчик Webasto — это обычно NTC термистор 10кОм.
# Подключите его в плечо делителя. Для точности в ESPHome используйте attenuation: 11db для ADC.
# Питание схемы
# Вход: 12В от аккумулятора.
# Для ESP32: Используйте надежный DC-DC преобразователь (например, на базе LM2596 или MP1584), понижающий до 5В. Внутренний стабилизатор ESP32 сделает 3.3В.
# Защита: Поставьте предохранитель 20А на общую линию 12В.
# 4. Рекомендации по сборке
# Общая земля (GND): Силовая земля (минус свечи, вентилятора) и земля ESP32 должны сходиться в одной точке ("звезда"), чтобы мощные токи не вызывали помех на процессоре.
# Обратные диоды: Параллельно вентилятору, помпе и топливному насосу ОБЯЗАТЕЛЬНО поставьте защитные диоды (катодом к +12В), иначе индуктивный выброс сожжет транзисторы.
# Оптическая развязка (Опционально): В идеале управлять затворами MOSFET через оптопары (например, PC817), чтобы полностью изолировать ESP32 от помех в бортовой сети авто.
# Конденсаторы: Поставьте электролитический конденсатор 2200мкФ 25В по линии 12В максимально близко к MOSFET свечи накала.
# Итог по деталям:
# ESP32 WROOM-32E — 1 шт.
# Модуль ACS712 (20A) — 1 шт.
# MOSFET IRLB3034 (Свеча) — 1 шт.
# MOSFET IRLZ44N (Вентилятор/Помпа) — 3 шт.
# DC-DC 12V -> 5V — 1 шт.
# Резисторы (100 Ом, 10кОм, 2кОм, 3.3кОм) — набор.
# Диоды 1N4007 — 3-4 шт.
# Схема строится вокруг ESP32 WROOM-32E. Все силовые нагрузки подключаются через N-канальные MOSFET-транзисторы.
# 1. Силовой блок (Управление 12В нагрузками)
# Все MOSFET подключаются по стандартной схеме: GPIO -> Резистор 100 Ом -> Gate (Затвор). Истоки (Source) всех транзисторов соединяются с общей землей (GND).
# Свеча накала (Glow Plug): GPIO 21 -> IRLB3034 (на радиаторе). Нагрузка (свеча) подключается между +12В и Drain (Стоком).
# Вентилятор (Fan): GPIO 22 -> IRLZ44N. Обязательно защитный диод (1N4007) параллельно мотору.
# Топливный насос: GPIO 19 -> IRLZ44N (или реле через BC547).
# Циркуляционная помпа ОЖ: GPIO 18 -> IRLZ44N (или реле).
# 2. Измерительный блок (Сенсоры)
# Датчик пламени (Ток свечи): Модуль ACS712 (20A) включается в разрыв провода свечи накала.
# Питание модуля: 5В (Vin).
# Выход (OUT) -> Делитель напряжения (2кОм к OUT, 3.3кОм к GND) -> GPIO 35. Это необходимо для согласования уровней 5В -> 3.3В.
# Температура воды (NTC): Штатный датчик Webasto (10кОм).
# Схема: 3.3В -> NTC -> GPIO 32 -> Резистор 10кОм -> GND. Рекомендуется конденсатор 0.1мкФ на GPIO 32 для снижения шумов.
# 3. Питание и защита
# DC-DC преобразователь: 12В (АКБ) -> 5В (Step-Down, напр. MP1584). 5В подается на контакт Vin ESP32 и питание ACS712.
# Общая земля: Силовая "земля" от свечи и логическая "земля" ESP32 должны сходиться в одной точке во избежание помех.
# Предохранитель: На общий вход 12В установите автомобильный предохранитель на 20А.
# Дополнительные компоненты
# MOSFETы с логическим уровнем (Logic Level): IRLB3034 или IRLZ44N критичны, так как обычные транзисторы (типа IRFZ44N) не откроются полностью от 3.3В ESP32.
# Радиаторы: Свеча накала при прогреве потребляет до 15-20А, поэтому её транзистор требует эффективного охлаждения.
# Конденсаторы: Электролит 1000-2200мкФ на входе 12В поможет сгладить скачки напряжения при работе свечи и насоса.


substitutions:

  # Назначение пинов (GPIO)
  pin_glow_plug: GPIO14    # Свеча накала (PWM)
  pin_fan: GPIO27          # Вентилятор (PWM)
  pin_fuel_pump: GPIO26    # Топливный насос
  pin_water_pump: GPIO25   # Водяная помпа (Кулант)
  pin_ntc_sensor: GPIO34   # Датчик температуры (ADC)
  pin_flame_sensor: GPIO35 # Датчик пламени/тока (ADC)


